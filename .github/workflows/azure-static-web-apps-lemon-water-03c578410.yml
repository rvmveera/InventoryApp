name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - DEV
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - DEV

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # Step 1: Checkout repo
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Step 2: Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Build and Deploy
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_WATER_03C578410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "UI"        # React app folder (no leading slash)
          api_location: ""          # Leave blank if no API
          output_location: "build"  # React build output folder
          ###### End of Configurations ######
        env:
          CI: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_WATER_03C578410 }}
          action: "close"
